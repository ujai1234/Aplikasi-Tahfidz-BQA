<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Masuk · Sistem Tahfidz &amp; Absensi — Pesantren Baitul Qur'an Al-Ikhwan</title>
  <meta name="description" content="Login sistem manajemen pesantren: tahfidz dan absensi ustadz." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Amiri:wght@700&family=Sora:wght@400;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body class="login-body">

  <main class="login-card">
    <div class="login-brand">
      <div class="brand-logo-img">
        <img src="logobqa.jpg" alt="Logo Baitul Qur'an Al-Ikhwan" />
      </div>
      <p class="bismillah-text">بِسْمِ اللَّهِ الرَّحْمَٰنِ الرَّحِيمِ</p>
      <div>
        <h1 class="login-title">Aplikasi Tahfidz &amp; Presensi</h1>
        <p class="login-sub-pill">Baitul Qur'an Al-Ikhwan</p>
      </div>
    </div>

    <form class="login-form">
      <div class="field">
        <label for="username">Username atau Email <span class="req">*</span></label>
        <input id="username" type="text" placeholder="mis. ahmad.fauzi" value="" autocomplete="username" />
      </div>

      <div class="field">
        <label for="password">Password <span class="req">*</span></label>
        <input id="password" type="password" placeholder="••••••••" value="" autocomplete="current-password" />
        <small class="hint">Gunakan akun terdaftar: Admin, Ustadz, Ustadzah, atau Kepala Pesantren.</small>
      </div>

      <div class="row between">
        <label class="remember">
          <input type="checkbox" checked />
          Ingat saya
        </label>
        <a href="#" class="link-more">Lupa password?</a>
      </div>

      <a href="index.html" class="btn btn-primary btn-lg btn-block">
        Masuk Ke Aplikasi
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><line x1="5" y1="12" x2="19" y2="12"/><polyline points="12 5 19 12 12 19"/></svg>
      </a>
    </form>



    <p class="login-foot">© 2026 Pesantren Baitul Qur'an Al-Ikhwan · Sesi diamankan JWT 5 menit</p>

  </main>

</body>
</html>
